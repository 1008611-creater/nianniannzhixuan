services:
  worker:
    image: "kidswear-studio-worker:haika-yunwu-reconcile-20260815"
    env_file:
      - /srv/kidswear-data/runtime-config-upload/.env.beta
      - /srv/kidswear-data/niannian-agent-vault/worker.env
    environment:
      AGENT_VAULT_ADDR: "http://niannian-agent-vault:14321"
      AGENT_VAULT_VAULT: "niannian-production"
      # Only the background worker uses the legacy origin for signed provider
      # input reads. The browser continues to use dh.cauai.fun.
      PUBLIC_SITE_URL: "https://dh-origin.cauai.fun"
      # Provider inputs are signed same-site URLs. Keep them off the credential
      # proxy so the worker can fetch private project media directly.
      NO_PROXY: "localhost,127.0.0.1,redis,postgres,object-storage,niannian-agent-vault,dh.cauai.fun,dh-origin.cauai.fun"
      IMAGE2_BASE_URL: "https://yunwu.ai/v1"
      # Agent Vault replaces this placeholder with YUNWU_IMAGE_API_KEY for yunwu.ai.
      IMAGE2_API_KEY: "__yunwu_image_api_key__"
      IMAGE2_MODEL: "gpt-image-2-c"
      IMAGE2_RELAY_REQUEST_TIMEOUT_MS: "90000"
      GENERATION_RECONCILE_INTERVAL_MS: "30000"
      IMAGE2_RELAY_ADAPTER_MODE: "enabled"
      RUNNINGHUB_IMAGE_ADAPTER_MODE: "disabled"
      WINDOWS_IMAGE_BRIDGE_MODE: "disabled"
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$${AGENT_VAULT_TOKEN}"
        install -m 755 /opt/agent-vault-source/agent-vault /tmp/agent-vault
        exec /tmp/agent-vault vault run -- npm run worker
    volumes:
      - /srv/kidswear-data/niannian-agent-vault/bin/agent-vault:/opt/agent-vault-source/agent-vault:ro
    networks:
      default: {}
      agent-vault:

networks:
  agent-vault:
    name: niannian-agent-vault_default
    external: true

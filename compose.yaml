services:
  niannian-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niannian-web
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 18893
      REMOTE_ORIGIN: https://dh-origin.cauai.fun
      PUBLIC_ORIGIN: https://dh.cauai.fun
      # Public template assets use the verified Tencent CDN hostname. Keep
      # private API media on the authenticated same-origin proxy.
      PUBLIC_MEDIA_CDN_ORIGIN: https://dh.cauai.fun
      CSRF_ORIGIN: http://127.0.0.1:18890
      # Enable only after Tencent CDN Type A authentication and cache rules are active.
      CDN_PLAYBACK_ENABLED: ${CDN_PLAYBACK_ENABLED:-0}
      CDN_PLAYBACK_HOST: ${CDN_PLAYBACK_HOST:-dh.cauai.fun}
      CDN_PLAYBACK_AUTH_KEY_FILE: /run/niannian-secrets/cdn-playback-auth-key
      CDN_PLAYBACK_TTL_SECONDS: ${CDN_PLAYBACK_TTL_SECONDS:-600}
    ports:
      - 127.0.0.1:18893:18893
    volumes:
      # Media derivatives belong on the attached data disk, not the root OS disk.
      - /srv/kidswear-data/niannian-web/playback:/app/playback
      - /srv/kidswear-data/niannian-web/secrets:/run/niannian-secrets:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:18893/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
